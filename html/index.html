<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remote-gnss</title>
<style>
  :root {
    --bg: #f4f4f1; --card: #fff; --fg: #1c1c1a; --muted: #6a6a64; --line: #e3e3dd;
    --accent: #1f6feb; --ok: #1a7f37; --warn: #a15c00; --bad: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1e; --fg: #ececea; --muted: #9a9a93; --line: #33332f;
      --accent: #4d8ff5; --ok: #3fb950; --warn: #e0a33a; --bad: #ef5350;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header {
    position: sticky; top: 0; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  h1 { flex: 1; margin: 0; font-size: 17px; }
  nav { display: flex; gap: 4px; }
  nav button {
    padding: 6px 14px; border: 0; border-radius: 8px; background: none;
    color: var(--muted); font: inherit; font-weight: 600; cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--bg); color: var(--fg); }
  #offline { padding: 8px 16px; background: var(--bad); color: #fff; text-align: center; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  section { margin-bottom: 16px; padding: 4px 16px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  h2 { margin: 12px 0 2px; color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .status { margin: 4px 0 10px; font-weight: 600; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { width: 38%; color: var(--muted); font-weight: normal; }
  td { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .note { margin: 8px 0; color: var(--muted); font-size: 13px; }
  label { display: block; margin: 12px 0 4px; color: var(--muted); }
  input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
  .buttons button { padding: 9px 16px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .buttons button:disabled { opacity: .5; cursor: default; }
  .primary { border: 0; background: var(--accent); color: #fff; }
  .secondary { border: 1px solid var(--line); background: none; color: var(--fg); }
  #msg:empty { display: none; }
  .cal { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; margin: 12px 0 8px; }
  .plot { display: flex; flex-direction: column; gap: 8px; }
  #plot {
    width: 240px; max-width: 100%; aspect-ratio: 1; height: auto; touch-action: none;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  #plot.sphere { cursor: grab; }
  .segmented {
    display: inline-flex; align-self: flex-start; overflow: hidden;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented span {
    display: block; padding: 5px 14px; color: var(--muted);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .segmented input:checked + span { background: var(--accent); color: #fff; }
  .segmented label:focus-within span { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cal-info { flex: 1; min-width: 180px; }
  .cal-info .buttons { margin-top: 8px; }
  .bar { height: 8px; margin: 6px 0; overflow: hidden; background: var(--line); border-radius: 4px; }
  .bar > div { width: 0; height: 100%; background: var(--accent); transition: width .3s; }
  /* Wide screens: Position and Magnetometer side by side, equally tall. */
  @media (min-width: 900px) {
    main { max-width: 1120px; }
    #panel-gnss { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    #panel-gnss > section { margin-bottom: 0; }
    #panel-wifi { max-width: 560px; margin: 0 auto; }
  }
</style>
</head>
<body>
<header>
  <h1>remote-gnss</h1>
  <nav role="tablist">
    <button role="tab" data-tab="gnss" aria-selected="true">GNSS</button>
    <button role="tab" data-tab="wifi" aria-selected="false">WiFi</button>
  </nav>
</header>
<div id="offline" hidden>The device isn't responding</div>

<main>
  <div id="panel-gnss" role="tabpanel">
    <section>
      <h2>Position</h2>
      <p class="status" id="gnss-status">Loading…</p>
      <table>
        <tr><th>Latitude</th><td id="lat">—</td></tr>
        <tr><th>Longitude</th><td id="lon">—</td></tr>
        <tr><th>Altitude</th><td id="alt">—</td></tr>
        <tr><th>Satellites</th><td id="sats">—</td></tr>
        <tr><th>HDOP</th><td id="hdop">—</td></tr>
        <tr><th>Speed</th><td id="speed">—</td></tr>
        <tr><th>Course</th><td id="course">—</td></tr>
        <tr><th>Time</th><td id="utc">—</td></tr>
      </table>
    </section>
    <section>
      <h2>Magnetometer</h2>
      <p class="status" id="mag-status">Loading…</p>
      <table>
        <tr><th>X</th><td id="mx">—</td></tr>
        <tr><th>Y</th><td id="my">—</td></tr>
        <tr><th>Z</th><td id="mz">—</td></tr>
        <tr><th>Magnitude</th><td id="mb">—</td></tr>
        <tr><th>Heading</th><td id="mh">—</td></tr>
      </table>
      <p class="note" id="mag-note"></p>
      <div class="cal" id="cal" hidden>
        <div class="plot">
          <div class="segmented" role="radiogroup" aria-label="Plot view">
            <label><input type="radio" name="plotview" value="compass" checked><span>Compass</span></label>
            <label><input type="radio" name="plotview" value="sphere"><span>Sphere</span></label>
          </div>
          <canvas id="plot" width="240" height="240" role="img"
                  aria-label="Compass, or the calibration readings in 3D"></canvas>
        </div>
        <div class="cal-info">
          <p class="status" id="cal-status"></p>
          <div class="bar" id="cal-barbox" hidden><div id="cal-bar"></div></div>
          <p class="note" id="cal-hint"></p>
          <div class="buttons">
            <button class="primary" type="button" id="cal-start">Calibrate</button>
            <button class="secondary" type="button" id="cal-fresh" hidden>Reset and calibrate</button>
            <button class="secondary" type="button" id="cal-accept" hidden>Save anyway</button>
            <button class="secondary" type="button" id="cal-stop" hidden>Stop</button>
          </div>
        </div>
      </div>
    </section>
  </div>
          <div class="buttons pair">
            <button class="secondary" type="button" id="cal-save">Save calibration</button>
            <button class="secondary" type="button" id="cal-load">Load calibration</button>
            <input type="file" id="cal-file" accept=".csv,text/csv" hidden>
          </div>

  <div id="panel-wifi" role="tabpanel" hidden>
    <section>
      <h2>Status</h2>
      <table>
        <tr><th>Network</th><td id="w-sta">—</td></tr>
        <tr><th>Address</th><td id="w-ip">—</td></tr>
        <tr><th>Access point</th><td id="w-ap">—</td></tr>
        <tr><th>Hostname</th><td id="w-host">—</td></tr>
        <tr><th>Device</th><td id="w-sys">—</td></tr>
      </table>
    </section>
    <section>
      <h2>Join a network</h2>
      <form id="wifi-form">
        <label for="ssid">Network name</label>
        <input id="ssid" name="ssid" required maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="63"
               autocomplete="new-password" placeholder="Leave empty for an open network">
        <div class="buttons">
          <button class="primary" type="submit">Save and restart</button>
          <button class="secondary" type="button" id="forget" hidden>Forget this network</button>
        </div>
      </form>
      <p class="note" id="wifi-note"></p>
      <p class="status" id="msg" role="status"></p>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const DASH = '—';
const QUALITY = {1: 'GPS fix', 2: 'DGPS fix', 4: 'RTK fixed', 5: 'RTK float', 6: 'Dead reckoning'};

function selectTab(name) {
  for (const b of document.querySelectorAll('[role=tab]')) {
    b.setAttribute('aria-selected', b.dataset.tab === name);
  }
  $('panel-gnss').hidden = name !== 'gnss';
  $('panel-wifi').hidden = name !== 'wifi';
  history.replaceState(null, '', name === 'gnss' ? location.pathname : '#' + name);
  if (view.cal && view.cal.state === 'running') animate(); else draw();
}
for (const b of document.querySelectorAll('[role=tab]')) {
  b.onclick = () => selectTab(b.dataset.tab);
}

const num = (v, digits, unit = '') => v == null ? DASH : v.toFixed(digits) + unit;
const coord = (v, pos, neg) => v == null ? DASH : `${Math.abs(v).toFixed(7)}° ${v < 0 ? neg : pos}`;

function status(el, text, cls) {
  el.textContent = text;
  el.className = 'status ' + cls;
}

function renderGnss(g) {
  const el = $('gnss-status');
  if (g.age_ms == null || g.age_ms > 3000) {
    status(el, 'No data from the GNSS receiver', 'bad');
  } else if (!g.fix) {
    status(el, `No fix yet · ${g.sats} satellites`, 'warn');
  } else {
    status(el, `${QUALITY[g.quality] || 'Fix'} · ${g.sats} satellites`, 'ok');
  }
  $('lat').textContent = coord(g.lat, 'N', 'S');
  $('lon').textContent = coord(g.lon, 'E', 'W');
  $('alt').textContent = num(g.alt, 1, ' m');
  $('sats').textContent = g.sentences ? g.sats : DASH;
  $('hdop').textContent = num(g.hdop, 2);
  $('speed').textContent = num(g.speed_kmh, 1, ' km/h');
  $('course').textContent = num(g.course, 1, '°');
  $('utc').textContent = g.utc ? g.utc + ' UTC' : DASH;
}

function renderMag(m) {
  const el = $('mag-status');
  if (!m.chip) {
    status(el, 'Magnetometer not detected', 'bad');
  } else if (m.age_ms == null || m.age_ms > 1000) {
    status(el, `${m.chip} · no recent readings`, 'warn');
  } else {
    status(el, m.chip, 'ok');
  }
  $('cal').hidden = !m.chip;
  const ok = m.x != null;
  $('mx').textContent = num(m.x, 2, ' µT');
  $('my').textContent = num(m.y, 2, ' µT');
  $('mz').textContent = num(m.z, 2, ' µT');
  $('mb').textContent = ok ? num(Math.hypot(m.x, m.y, m.z), 2, ' µT') : DASH;
  $('mh').textContent = ok ? num((Math.atan2(m.y, m.x) * 180 / Math.PI + 360) % 360, 1, '°') : DASH;
  $('mag-note').textContent = (m.calibrated ? 'Calibrated (offsets removed), sensor axes.' : 'Raw sensor axes, uncalibrated.') +
    ' The heading is atan2(Y, X), valid only with the module held flat.';
}

function renderWifi(w) {
  const source = w.sta_saved ? 'set here' : 'built in';
  $('w-sta').textContent = !w.sta_configured ? 'None configured'
    : w.sta_connected ? `Connected to "${w.sta_ssid}" (${source}) · ${w.rssi} dBm`
    : `Connecting to "${w.sta_ssid}" (${source})…`;
  $('w-ip').textContent = w.sta_connected ? w.sta_ip : DASH;
  $('w-ap').textContent = w.ap ? `On · "${w.ap_ssid}", open · 192.168.4.1` : 'Off';
  $('w-host').textContent = w.hostname;
  $('forget').hidden = !w.sta_saved;
  // Pre-fill the network name once; never overwrite what's being typed.
  const ssid = $('ssid');
  if (!ssid.dataset.filled && w.sta_ssid && !ssid.value && document.activeElement !== ssid) {
    ssid.value = w.sta_ssid;
    ssid.dataset.filled = '1';
  }
  $('wifi-note').textContent = `Saving restarts the device. If it can't connect within ${w.fallback_s} s, ` +
    `the open access point "${w.ap_ssid}" comes up.`;
}

function renderSystem(sys) {
  const t = sys.uptime_s;
  const up = t < 120 ? `${t} s` : t < 7200 ? `${Math.floor(t / 60)} min` : `${Math.floor(t / 3600)} h ${Math.floor(t / 60) % 60} min`;
  $('w-sys').textContent = `Up ${up} · last reset: ${sys.reset}`;
}

let hostname = '';

async function poll() {
  try {
    const r = await fetch('/api/status', {cache: 'no-store', signal: AbortSignal.timeout(3000)});
    const s = await r.json();
    hostname = s.wifi.hostname;
    renderGnss(s.gnss);
    renderMag(s.mag);
    renderWifi(s.wifi);
    renderSystem(s.system);
    $('offline').hidden = true;
  } catch {
    $('offline').hidden = false;
  }
  setTimeout(poll, 1000);
}

async function post(url, body, done) {
  const msg = $('msg');
  status(msg, 'Saving…', '');
  try {
    const r = await fetch(url, {method: 'POST', body, signal: AbortSignal.timeout(5000)});
    // An error from the server itself comes back as HTML, not JSON.
    const j = (r.headers.get('content-type') || '').includes('json') ? await r.json() : null;
    if (!j || !j.ok) throw new Error((j && j.error) || `the device answered ${r.status}`);
    status(msg, done, 'ok');
  } catch (err) {
    status(msg, 'Failed: ' + err.message, 'bad');
  }
}

$('wifi-form').onsubmit = e => {
  e.preventDefault();
  const ssid = $('ssid').value;
  // The name is pre-filled, so an untouched form would otherwise save the current
  // network as an open one and the device would no longer be able to join it.
  if (!$('password').value &&
      !confirm(`Save "${ssid}" with no password? Only do this if the network really is open.`)) {
    return;
  }
  post('/api/wifi', new URLSearchParams(new FormData(e.target)),
       `Saved. Restarting to join "${ssid}"; once it's on, open http://${hostname || location.host}/ from that network.`);
};

$('forget').onclick = () => {
  if (!confirm('Forget this network? The device restarts and uses the built-in network, or its access point.')) return;
  post('/api/wifi/forget', null, 'Forgotten. Restarting…');
};

// ---- Magnetometer plot and calibration ----
// The firmware runs the calibration (see CALIBRATION.md). The plot shows its
// readings as dots and the current field as an arrow from the fitted centre.
const view = {cal: null, live: null, since: 0, skip: true, calTimer: 0, calError: '', radius: 0,
              fg: '', muted: '', mode: 'compass', lastState: '', heading: null, headingTarget: null,
              yaw: 0.8, pitch: 0.45, drag: null, animating: false};
const CARDINALS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const LEVELS = ['sphere', 'per-axis', '9-parameter'];  // how many parameters the fit dares to use

// Colours from the stylesheet, read once: the canvas can't use CSS variables.
function colour(name) {
  if (!view[name]) {
    view[name] = name === 'fg' ? getComputedStyle(document.body).color
               : name === 'bg' ? getComputedStyle($('plot')).backgroundColor
                               : getComputedStyle($('cal-hint')).color;
  }
  return view[name];
}

// The firmware sends the calibration; applying it here keeps the plot in step
// with the table, which shows the device's own corrected readings.
function calibrated(m) {
  const cal = view.cal && view.cal.cal;
  if (!cal) return m;
  const d = [m[0] - cal.offset[0], m[1] - cal.offset[1], m[2] - cal.offset[2]];
  return [0, 1, 2].map(i => cal.matrix[3 * i] * d[0] + cal.matrix[3 * i + 1] * d[1] + cal.matrix[3 * i + 2] * d[2]);
}

// Shortest way round from the drawn heading to the measured one, in degrees.
function headingError() {
  if (view.headingTarget == null) return 0;
  if (view.heading == null) {
    view.heading = view.headingTarget;
    return 0;
  }
  return ((view.headingTarget - view.heading + 540) % 360) - 180;
}

function setMode(mode) {
  view.mode = mode;
  for (const input of document.querySelectorAll('input[name=plotview]')) {
    input.checked = input.value === mode;
  }
  $('plot').classList.toggle('sphere', mode === 'sphere');
  animate();  // frame() draws once and stops if there's nothing to animate
}

const quantile = (sorted, q) => sorted[Math.floor(q * (sorted.length - 1))];

// Colour by height: blue #1f5fbf (down), green #1a9e6a, yellow #d9a400 (up).
const PALETTE = Array.from({length: 21}, (_, i) => {
  const t = i / 20;
  const [a, b, f] = t < 0.5 ? [[31, 95, 191], [26, 158, 106], t * 2] : [[26, 158, 106], [217, 164, 0], t * 2 - 1];
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',')})`;
});
const colourOf = d => PALETTE[Math.round((d[2] / (Math.hypot(...d) || 1) + 1) * 10)];

function drawArrow(g, from, to, colour) {
  const dx = to[0] - from[0], dy = to[1] - from[1], len = Math.hypot(dx, dy);
  if (len < 1) return;
  const ux = dx / len, uy = dy / len, head = Math.min(12, len * 0.4);
  const bx = to[0] - ux * head, by = to[1] - uy * head;
  g.strokeStyle = g.fillStyle = colour;
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(from[0], from[1]); g.lineTo(bx, by); g.stroke();
  g.beginPath();
  g.moveTo(to[0], to[1]);
  g.lineTo(bx - uy * head * 0.5, by + ux * head * 0.5);
  g.lineTo(bx + uy * head * 0.5, by - ux * head * 0.5);
  g.closePath();
  g.fill();
}

function draw() {
  const cv = $('plot'), c = view.cal;
  const size = cv.clientWidth, dpr = window.devicePixelRatio || 1;
  if (!size || !c) return;
  if (cv.width !== Math.round(size * dpr)) cv.width = cv.height = Math.round(size * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, size, size);
  if (view.mode === 'compass') {
    drawCompass(g, size, c);
  } else {
    drawSphere(g, size, c);
  }
}

// A compass card: the ring turns so that N sits at magnetic north, while the
// index mark at the top stays with the module's +X axis.
function drawCompass(g, size, c) {
  const cx = size / 2, cy = size / 2, r = size / 2 - 16;
  const fg = colour('fg'), muted = colour('muted');

  g.lineWidth = 1.5;
  g.strokeStyle = muted;
  g.beginPath();
  g.arc(cx, cy, r, 0, 2 * Math.PI);
  g.stroke();

  g.fillStyle = fg;  // index mark: where the module points
  g.beginPath();
  g.moveTo(cx, cy - r - 1);
  g.lineTo(cx - 5, cy - r - 10);
  g.lineTo(cx + 5, cy - r - 10);
  g.closePath();
  g.fill();

  g.textAlign = 'center';
  if (view.heading == null) {
    g.fillStyle = muted;
    g.textBaseline = 'middle';
    g.font = '13px system-ui, sans-serif';
    g.fillText('waiting for readings', cx, cy);
    return;
  }

  // The card turns, but its letters stay upright: rotated ones are unreadable this small.
  for (let a = 0; a < 360; a += 15) {
    const major = a % 45 === 0, t = (a - view.heading) * Math.PI / 180;
    const x = Math.sin(t), y = -Math.cos(t), len = major ? 9 : 5;
    g.strokeStyle = major ? fg : muted;
    g.lineWidth = major ? 1.5 : 1;
    g.beginPath();
    g.moveTo(cx + x * r, cy + y * r);
    g.lineTo(cx + x * (r - len), cy + y * (r - len));
    g.stroke();
  }
  g.textBaseline = 'middle';
  CARDINALS.forEach((name, i) => {
    const t = (i * 45 - view.heading) * Math.PI / 180, rr = r - 21;
    g.fillStyle = name === 'N' ? '#d33' : fg;
    g.font = (name.length === 1 ? 'bold 13px ' : '11px ') + 'system-ui, sans-serif';
    g.fillText(name, cx + Math.sin(t) * rr, cy - Math.cos(t) * rr);
  });

  // Needle: red to magnetic north, grey opposite, clear of the hub.
  const rad = view.heading * Math.PI / 180;
  const hx = -Math.sin(rad), hy = -Math.cos(rad), hub = 34, tip = r - 30;
  g.lineWidth = 3;
  g.strokeStyle = '#d33';
  g.beginPath();
  g.moveTo(cx + hx * hub, cy + hy * hub);
  g.lineTo(cx + hx * tip, cy + hy * tip);
  g.stroke();
  g.strokeStyle = muted;
  g.beginPath();
  g.moveTo(cx - hx * hub, cy - hy * hub);
  g.lineTo(cx - hx * tip, cy - hy * tip);
  g.stroke();

  g.fillStyle = colour('bg');  // hub, so the readout never sits on the needle
  g.beginPath();
  g.arc(cx, cy, hub - 2, 0, 2 * Math.PI);
  g.fill();
  g.textBaseline = 'alphabetic';
  g.fillStyle = fg;
  g.font = 'bold 20px system-ui, sans-serif';
  g.fillText(`${Math.round(view.heading) % 360}°`, cx, cy + 2);
  g.font = '11px system-ui, sans-serif';
  g.fillStyle = muted;
  g.fillText(CARDINALS[Math.round(view.heading / 45) % 8], cx, cy + 18);
  if (!c.cal) {
    g.fillStyle = '#a15c00';
    g.fillText('uncalibrated', cx, cy + r + 12);
  }
}

// The calibration readings as a point cloud, with the current field as an arrow.
function drawSphere(g, size, c) {
  const running = c.state === 'running';
  const centre = running || !c.cal ? c.centre : c.cal.offset;
  const rel = p => [p[0] - centre[0], p[1] - centre[1], p[2] - centre[2]];
  // view.radius is recomputed only when the readings change, not per frame.
  let r = view.radius;
  if (view.live) r = Math.max(r, Math.hypot(...rel(view.live)));
  if (!r) return;

  const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const k = (size / 2 - 12) / (r * 1.15);
  // Turn about Z (yaw), then look down by pitch, Z up on screen. Gives [x, y, depth].
  const project = d => {
    const x = d[0] * cy - d[1] * sy, y = d[0] * sy + d[1] * cy;
    return [size / 2 + x * k, size / 2 - (d[2] * cp + y * sp) * k, y * cp - d[2] * sp];
  };
  const o = project([0, 0, 0]), len = r * 1.1;
  g.lineWidth = 1.5;
  g.font = '11px system-ui, sans-serif';
  for (const [label, colour, v] of [['X', '#d33', [len, 0, 0]], ['Y', '#2a2', [0, len, 0]], ['Z', '#36c', [0, 0, len]]]) {
    const e = project(v);
    g.strokeStyle = g.fillStyle = colour;
    g.beginPath(); g.moveTo(o[0], o[1]); g.lineTo(e[0], e[1]); g.stroke();
    g.fillText(label, e[0] + 3, e[1] - 3);
  }
  // Dots are fainter outside calibration, so the arrow stands out; far side dimmer still.
  for (const p of c.points) {
    const d = rel(p), s = project(d);
    g.globalAlpha = (s[2] > 0 ? 0.35 : 1) * (running ? 0.9 : 0.5);
    g.fillStyle = colourOf(d);
    g.fillRect(s[0] - 1.5, s[1] - 1.5, 3, 3);
  }
  g.globalAlpha = 1;
  if (view.live) {
    const d = rel(view.live), s = project(d);
    if (running) {  // where the module points now, among the dots being collected
      g.strokeStyle = colour('fg');
      g.lineWidth = 1.5;
      g.beginPath(); g.arc(s[0], s[1], 5, 0, 2 * Math.PI); g.stroke();
    } else {
      drawArrow(g, o, s, colourOf(d));
    }
  }
}

function frame() {
  const spinning = view.mode === 'sphere' && view.cal && view.cal.state === 'running';
  const settling = view.mode === 'compass' && Math.abs(headingError()) > 0.2;
  // A hidden tab or panel leaves the canvas zero-wide: stop until it's shown again.
  if ((!spinning && !settling && !view.drag) || document.hidden || !$('plot').clientWidth) {
    view.animating = false;
    draw();
    return;
  }
  if (view.mode === 'compass') {
    view.heading = (view.heading + headingError() * 0.25 + 360) % 360;  // ease, don't jump
  } else if (!view.drag) {
    view.yaw += 0.005;
  }
  draw();
  requestAnimationFrame(frame);
}

function animate() {
  if (!view.animating) {
    view.animating = true;
    requestAnimationFrame(frame);
  }
}

function renderCal() {
  const c = view.cal, running = c.state === 'running', saved = c.points.length > 0;
  const pct = Math.round(c.progress * 100);
  if (running) view.calError = '';  // the last request clearly went through
  // Show the sphere while calibrating; going back is the user's choice.
  if (running && view.lastState !== 'running') setMode('sphere');
  view.lastState = c.state;
  $('cal-start').hidden = running;
  $('cal-fresh').hidden = running || !saved;
  $('cal-stop').hidden = !running;
  $('cal-accept').hidden = !(running && c.can_accept);
  $('cal-start').textContent = !saved ? 'Calibrate' : c.cal ? 'Calibrate again' : 'Continue calibration';
  $('cal-barbox').hidden = !running && (c.cal || !saved);
  $('cal-bar').style.width = pct + '%';
  const missing = c.missing.map(a => a.replace('-', '−'));
  const kept = (c.cal ? 'The previous calibration stays in use. ' : '') +
    'The readings are saved; Continue calibration picks up from here.';
  const summary = c.cal ? `radius ${c.cal.radius.toFixed(1)} µT, fit ${(c.cal.rms * 100).toFixed(1)} %` : '';
  let text, cls, hint;
  if (running) {
    // The bar is coverage; finishing also needs the fit itself to pass, so say what's left.
    text = c.blocking ? `Calibrating · waiting on ${c.blocking}` : `Calibrating · ${pct} %`;
    cls = '';
    hint = `${c.points.length} readings kept, ${Math.round(c.coverage * 100)} % of directions covered (target 90 %). ` +
      'Rotate the module slowly through every orientation' +
      (missing.length ? `; not reached yet: ${missing.join(', ')}.` : '.');
    if (c.fit) {
      hint += ` Fit so far: ${(c.fit.rms * 100).toFixed(1)} % off the sphere with the ${LEVELS[c.fit.level]} model, ` +
        `${c.fit.inliers} of ${c.fit.points} readings used.`;
    }
    if (c.can_accept) {
      hint += ' Save anyway keeps this as a rough calibration — usable, just not as good as it could be.';
    }
  } else if (c.state === 'failed') {
    [text, cls, hint] = [`Calibration failed: ${c.reason || 'unknown reason'}`, 'bad', kept];
  } else if (c.state === 'stopped') {
    [text, cls, hint] = [`Stopped at ${pct} %`, 'warn', kept];
  } else if (c.cal) {
    const label = c.state === 'done' ? 'Calibration saved' : 'Calibrated';
    text = c.cal.quality === 'good' ? `${label} · ${summary}` : `${label} · ${c.cal.quality} · ${summary}`;
    cls = c.cal.quality === 'good' ? 'ok' : 'warn';
    hint = 'The arrow is the current field; the dots are the calibration readings. ' +
      'Calibrate again continues from them; Reset and calibrate discards them. Offsets only for now: the full 9-parameter fit follows.';
  } else if (saved) {
    // Not "progress": completing also needs fresh readings, which this doesn't count.
    [text, cls, hint] = [`Not calibrated · ${Math.round(c.coverage * 100)} % of directions covered`, 'warn',
      'Continue calibration picks up from the saved readings; Reset and calibrate discards them.'];
  } else {
    [text, cls, hint] = ['Not calibrated', 'warn', 'Press Calibrate, then rotate the module slowly through every orientation.'];
  }
  if (view.calError) {
    [text, cls] = [view.calError, 'bad'];
  }
  status($('cal-status'), text, cls);
  if (running && c.refused) {
    hint += ` ${c.refused} readings turned away for disagreeing with their own direction.`;
  }
  if (!running && c.message) {
    hint = c.message;
  }
  $('cal-hint').textContent = hint;
  if (running) animate(); else if (!view.animating) draw();
}

// The 0.98 quantile of the readings' distance from the centre, for the plot scale.
function calRadius(c) {
  const centre = c.state === 'running' || !c.cal ? c.centre : c.cal.offset;
  const radii = c.points.map(p => Math.hypot(p[0] - centre[0], p[1] - centre[1], p[2] - centre[2]))
    .sort((a, b) => a - b);
  return radii.length ? quantile(radii, 0.98) : c.cal ? c.cal.radius : 0;
}

async function pollCal() {
  clearTimeout(view.calTimer);
  let ok = false;
  try {
    const r = await fetch('/api/cal', {cache: 'no-store', signal: AbortSignal.timeout(4000)});
    view.cal = await r.json();
    view.radius = calRadius(view.cal);
    renderCal();
    ok = true;
  } catch {
    // the status poll already shows when the device is unreachable
  }
  view.calTimer = setTimeout(pollCal, !ok || view.cal.state === 'running' ? 1000 : 10000);
}

// Only the latest reading matters here, so each request skips to the newest.
// Idle unless the plot is actually on screen: this runs on phones.
async function pollLive() {
  const showing = !document.hidden && !$('panel-gnss').hidden && !$('cal').hidden;
  if (showing) {
    try {
      const r = await fetch(`/api/mag/samples?since=${view.since}`, {cache: 'no-store', signal: AbortSignal.timeout(3000)});
      const j = await r.json();
      if (!view.skip && j.seq >= view.since && j.samples.length) {
        const [, , x, y, z] = j.samples[j.samples.length - 1];
        view.live = [x, y, z].map(v => v * j.ut_per_count);
        const b = calibrated(view.live);
        view.headingTarget = (Math.atan2(b[1], b[0]) * 180 / Math.PI + 360) % 360;
        if (view.mode === 'compass') animate(); else if (!view.animating) draw();
      }
      view.since = j.seq;
      view.skip = false;
    } catch {
      // shown by the status poll
    }
  }
  setTimeout(pollLive, showing ? 500 : 2000);
}

async function calPost(url) {
  view.calError = '';
  try {
    const r = await fetch(url, {method: 'POST', signal: AbortSignal.timeout(5000)});
    const j = (r.headers.get('content-type') || '').includes('json') ? await r.json() : null;
    if (!j || !j.ok) view.calError = (j && j.error) || `The device refused the request (${r.status})`;
  } catch {
    view.calError = "The device didn't answer";
  }
  pollCal();  // renderCal shows view.calError until the session starts
}
$('cal-start').onclick = () => calPost('/api/cal/start');
$('cal-fresh').onclick = () => {
  if (confirm('Discard the saved readings and start over? The current calibration stays in use until the new one completes.')) {
    calPost('/api/cal/start?fresh=1');
  }
};
$('cal-stop').onclick = () => calPost('/api/cal/stop');
$('cal-accept').onclick = () => calPost('/api/cal/accept');

for (const input of document.querySelectorAll('input[name=plotview]')) {
  input.onchange = () => setMode(input.value);
}

const sphere = $('plot');
sphere.onpointerdown = e => {
  if (view.mode !== 'sphere') return;  // only the point cloud turns
  view.drag = [e.clientX, e.clientY, view.yaw, view.pitch];
  sphere.setPointerCapture(e.pointerId);
  animate();
// The readings themselves, not the fitted parameters: they are what a later
// session continues from, and what the offline tools in tools/ read.
$('cal-save').onclick = () => {
  const pts = view.cal && view.cal.points;
  if (!pts || !pts.length) {
    view.calError = 'No readings to save yet';
    renderCal();
    return;
  }
  const csv = 'seq,t_ms,x_ut,y_ut,z_ut\n' +
    pts.map(([x, y, z], i) => `${i + 1},${i * 100},${x},${y},${z}`).join('\n') + '\n';
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const name = `mag-${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}` +
    `-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.csv`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
};

$('cal-load').onclick = () => $('cal-file').click();
$('cal-file').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';  // so the same file can be chosen again
  if (file) {
    await calPost('/api/cal/points', await file.text());
  }
};

};
sphere.onpointermove = e => {
  if (!view.drag) return;
  const [x0, y0, yaw0, pitch0] = view.drag;
  view.yaw = yaw0 + (e.clientX - x0) * 0.01;
  view.pitch = Math.max(-1.5, Math.min(1.5, pitch0 + (e.clientY - y0) * 0.01));
};
sphere.onpointerup = sphere.onpointercancel = sphere.onlostpointercapture = () => { view.drag = null; };

addEventListener('hashchange', () => selectTab(location.hash === '#wifi' ? 'wifi' : 'gnss'));
addEventListener('visibilitychange', () => {
  if (!document.hidden && view.cal && view.cal.state === 'running') animate();
});

selectTab(location.hash === '#wifi' ? 'wifi' : 'gnss');
poll();
pollCal();
pollLive();
</script>
</body>
</html>
